name: Admin Portal CI & Free-Tier Firebase Spark Deploy

on:
  push:
    branches: [main]
    paths:
      - 'admin-portal/**'
      - 'firestore.rules'
      - '.github/workflows/deploy-admin-and-firebase.yml'
  workflow_dispatch:
    inputs:
      deploy_hosting_and_rules:
        description: 'Deploy static Admin UI to Firebase Hosting & Firestore rules (Spark free tier — requires FIREBASE_TOKEN secret)'
        required: true
        type: boolean
        default: false
      api_base_url:
        description: 'Optional Free-Tier Node.js Backend URL (Render / Koyeb / Railway)'
        required: false
        default: ''

permissions:
  contents: read

env:
  PROJECT_ID: gen-lang-client-0343268738

jobs:
  verify-admin-portal:
    name: Test & Build Admin Portal (100% Free-Tier CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install dependencies & Run Backend/RBAC Tests
        working-directory: admin-portal
        run: |
          npm ci
          npm test

      - name: Build Admin Portal Static Bundle
        working-directory: admin-portal
        env:
          VITE_FIREBASE_PROJECT_ID: gen-lang-client-0343268738
          VITE_FIREBASE_AUTH_DOMAIN: gen-lang-client-0343268738.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: gen-lang-client-0343268738.firebasestorage.app
          VITE_FIREBASE_DATABASE_ID: ai-studio-android-abk-452af8d1-cf14-40e7-aead-48a40e7f239d
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
        run: npm run build

      - name: Upload Admin Portal dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: abk-admin-portal-dist
          path: admin-portal/dist

  deploy-spark-hosting-and-rules:
    name: Deploy Firebase Hosting & Firestore Rules (Spark Free Tier)
    needs: verify-admin-portal
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_hosting_and_rules == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate FIREBASE_TOKEN Secret
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Missing FIREBASE_TOKEN in GitHub Secrets. Alternatively, host admin-portal/dist for free on Cloudflare Pages, Vercel, or Netlify without Firebase CLI."
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Admin Portal
        working-directory: admin-portal
        env:
          VITE_FIREBASE_PROJECT_ID: gen-lang-client-0343268738
          VITE_FIREBASE_AUTH_DOMAIN: gen-lang-client-0343268738.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: gen-lang-client-0343268738.firebasestorage.app
          VITE_FIREBASE_DATABASE_ID: ai-studio-android-abk-452af8d1-cf14-40e7-aead-48a40e7f239d
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          npm ci
          npm run build

      - name: Deploy Firestore Rules & Static Admin Hosting (Zero Billing)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:rules,hosting \
            --config admin-portal/firebase.hosting.json \
            --project "$PROJECT_ID" \
            --non-interactive || \
          npx --yes firebase-tools deploy \
            --only firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive

name: Admin Portal CI & Free-Tier Static HTTPS Deploy

on:
  push:
    branches: [main]
    paths:
      - 'admin-portal/**'
      - 'firestore.rules'
      - '.github/workflows/deploy-admin-and-firebase.yml'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Choose optional deploy target (leave none if Cloudflare Pages is linked directly in Cloudflare Dashboard)'
        required: true
        type: choice
        default: none
        options:
          - none
          - cloudflare_pages
          - github_pages
          - firebase_spark
      api_base_url:
        description: 'Optional Free-Tier Node.js Backend URL (local / Render / Koyeb)'
        required: false
        default: ''

permissions:
  contents: read

env:
  PROJECT_ID: gen-lang-client-0343268738
  DATABASE_ID: ai-studio-android-abk-452af8d1-cf14-40e7-aead-48a40e7f239d

jobs:
  verify-admin-portal:
    name: Test, Security Audit & Build Admin Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install dependencies & Run Backend/RBAC Tests
        working-directory: admin-portal
        run: |
          npm ci
          npm test

      - name: Build Admin Portal Static Bundle
        working-directory: admin-portal
        env:
          VITE_BASE_PATH: '/'
          VITE_FIREBASE_PROJECT_ID: gen-lang-client-0343268738
          VITE_FIREBASE_AUTH_DOMAIN: gen-lang-client-0343268738.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: gen-lang-client-0343268738.firebasestorage.app
          VITE_FIREBASE_DATABASE_ID: ai-studio-android-abk-452af8d1-cf14-40e7-aead-48a40e7f239d
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
          VITE_R2_WORKER_URL: ${{ vars.VITE_R2_WORKER_URL || '' }}
        run: npm run build

      - name: Verify Cloudflare Pages SPA files & Zero Admin Secrets in dist/
        working-directory: admin-portal
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test -f dist/_headers
          if grep -rnE "firebase-admin|BEGIN PRIVATE KEY|FIREBASE_SERVICE_ACCOUNT|\"private_key\"" dist/; then
            echo "::error::Sensitive server/admin credentials detected inside frontend dist/ bundle!"
            exit 1
          fi

      - name: Upload Admin Portal dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: abk-admin-portal-dist
          path: admin-portal/dist

  deploy-cloudflare-pages:
    name: Deploy Admin Portal to Cloudflare Pages (Free HTTPS)
    needs: verify-admin-portal
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'cloudflare_pages'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Cloudflare Credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in GitHub Secrets. Note: Connecting GitHub directly from Cloudflare Pages Dashboard requires zero secrets."
            exit 1
          fi

      - name: Download verified dist artifact
        uses: actions/download-artifact@v4
        with:
          name: abk-admin-portal-dist
          path: admin-portal/dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin-portal
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'abk-admin-portal' }}

  deploy-github-pages:
    name: Deploy Admin Portal to GitHub Pages (Zero-Secret HTTPS)
    needs: verify-admin-portal
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'github_pages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Build for GitHub Pages subpath
        working-directory: admin-portal
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FIREBASE_PROJECT_ID: gen-lang-client-0343268738
          VITE_FIREBASE_AUTH_DOMAIN: gen-lang-client-0343268738.firebaseapp.com
          VITE_FIREBASE_STORAGE_BUCKET: gen-lang-client-0343268738.firebasestorage.app
          VITE_FIREBASE_DATABASE_ID: ai-studio-android-abk-452af8d1-cf14-40e7-aead-48a40e7f239d
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}
          VITE_R2_WORKER_URL: ${{ vars.VITE_R2_WORKER_URL || '' }}
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-portal/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-spark-hosting-and-rules:
    name: Deploy Firebase Hosting & Firestore Rules (Optional FIREBASE_TOKEN)
    needs: verify-admin-portal
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'firebase_spark'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate FIREBASE_TOKEN Secret
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Missing FIREBASE_TOKEN in GitHub Secrets. Use Cloudflare Pages or GitHub Pages instead without any token."
            exit 1
          fi

      - name: Download verified dist artifact
        uses: actions/download-artifact@v4
        with:
          name: abk-admin-portal-dist
          path: admin-portal/dist

      - name: Deploy Firestore Rules & Static Admin Hosting (Zero Billing)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx --yes firebase-tools deploy \
            --only firestore:rules,hosting \
            --config admin-portal/firebase.hosting.json \
            --project "$PROJECT_ID" \
            --non-interactive || \
          npx --yes firebase-tools deploy \
            --only firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive

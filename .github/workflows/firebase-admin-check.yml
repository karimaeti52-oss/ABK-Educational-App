name: Verify or Grant Firebase Admin (Phone Safe)

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'البريد الإلكتروني لحساب المسؤول في Firebase Auth (مطلوب)'
        required: true
        type: string
      action:
        description: 'اختر verify_only للفحص القرائي فقط، أو grant_super_admin لمنح SUPER_ADMIN'
        required: true
        type: choice
        default: verify_only
        options:
          - verify_only
          - grant_super_admin
      confirm_grant_phrase:
        description: 'مطلوب فقط عند اختيار grant_super_admin: اكتب CONFIRM_SUPER_ADMIN للتأكيد'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0343268738
  DATABASE_ID: ai-studio-android-abk-452af8d1-cf14-40e7-aead-48a40e7f239d

jobs:
  verify-admin-readonly:
    name: Verify Firebase Admin (Read-Only Service Account)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'karimaeti52-oss/ABK-Educational-App' &&
      github.actor == github.repository_owner &&
      github.repository_owner == 'karimaeti52-oss' &&
      inputs.action == 'verify_only'
    steps:
      - name: Validate guards, read-only WIF config, and inputs
        env:
          INPUT_EMAIL: ${{ inputs.admin_email }}
          INPUT_ACTION: ${{ inputs.action }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
          WIF_VERIFY_SA: ${{ vars.GCP_WIF_VERIFY_SERVICE_ACCOUNT || secrets.GCP_WIF_VERIFY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::التشغيل مسموح فقط يدوياً عبر workflow_dispatch وعلى فرع refs/heads/main."
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY:-}" != "karimaeti52-oss/ABK-Educational-App" ] || [ "${GITHUB_REPOSITORY_OWNER:-}" != "karimaeti52-oss" ] || [ "${GITHUB_ACTOR:-}" != "${GITHUB_REPOSITORY_OWNER:-}" ]; then
            echo "::error::التشغيل مسموح فقط لمالك المستودع (karimaeti52-oss)."
            exit 1
          fi
          if [ "$INPUT_ACTION" != "verify_only" ]; then
            echo "::error::هذه الوظيفة مخصصة للفحص القرائي فقط (verify_only)."
            exit 1
          fi

          CLEAN_EMAIL=$(printf '%s' "$INPUT_EMAIL" | tr -d '[:space:]')
          if ! printf '%s' "$CLEAN_EMAIL" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
            echo "::error::البريد الإلكتروني المدخل غير صالح."
            exit 1
          fi
          echo "::add-mask::$CLEAN_EMAIL"

          CLEAN_WIF_PROVIDER=$(printf '%s' "${WIF_PROVIDER:-}" | tr -d '[:space:]')
          CLEAN_WIF_VERIFY_SA=$(printf '%s' "${WIF_VERIFY_SA:-}" | tr -d '[:space:]')
          if [ -z "$CLEAN_WIF_PROVIDER" ] || [ -z "$CLEAN_WIF_VERIFY_SA" ]; then
            {
              echo "### إعداد حساب القراءة فقط عبر Workload Identity Federation مطلوب"
              echo "يستخدم وضع \`verify_only\` حساب خدمة منفصلاً بصلاحيات **قراءة فقط** عبر GitHub OIDC (بدون مفاتيح JSON دائمة)."
              echo ""
              echo "أضف القيمتين التاليتين في **Settings → Secrets and variables → Actions**:"
              echo "- \`GCP_WIF_PROVIDER\`: مسار مزود WIF الموجود مسبقاً (\`projects/438492626356/locations/global/workloadIdentityPools/<POOL_ID>/providers/<PROVIDER_ID>\`)."
              echo "- \`GCP_WIF_VERIFY_SERVICE_ACCOUNT\`: بريد حساب الخدمة المخصص **للقراءة فقط** (مثل \`midad-admin-readonly@gen-lang-client-0343268738.iam.gserviceaccount.com\`؛ **لا** تستخدم \`abk-github-deployer\` لهذا الوضع)."
              echo ""
              echo "الصلاحيات المطلوبة لحساب القراءة فقط (بدون أي صلاحية تعديل أو حذف):"
              echo "- Firebase Auth: \`roles/firebaseauth.viewer\` (أو دور مخصص بصلاحية \`firebaseauth.users.get\` فقط)."
              echo "- Firestore: \`roles/datastore.viewer\` (أو دور مخصص بصلاحيتي \`datastore.entities.get\` و \`datastore.entities.list\` فقط)."
              echo "- شرط ربط OIDC في Workload Identity: \`attribute.repository=='karimaeti52-oss/ABK-Educational-App'\`."
              echo "- ملاحظة: صلاحيات IAM على Firestore تنطبق على مستوى المشروع/قاعدة البيانات ولا تحصر الوصول بمجموعة \`admins\` وحدها، كما أن Admin SDK يتجاوز Firestore Security Rules."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing GCP_WIF_PROVIDER or GCP_WIF_VERIFY_SERVICE_ACCOUNT."
            exit 1
          fi

          if ! printf '%s' "$CLEAN_WIF_PROVIDER" | grep -Eq '^projects/[0-9]+/locations/[a-z0-9-]+/workloadIdentityPools/[A-Za-z0-9._-]+/providers/[A-Za-z0-9._-]+$'; then
            echo "::error::تنسيق GCP_WIF_PROVIDER غير صالح."
            exit 1
          fi
          if ! printf '%s' "$CLEAN_WIF_VERIFY_SA" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.iam\.gserviceaccount\.com$'; then
            echo "::error::تنسيق GCP_WIF_VERIFY_SERVICE_ACCOUNT غير صالح."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate via GitHub OIDC (Read-Only Service Account)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_VERIFY_SERVICE_ACCOUNT || secrets.GCP_WIF_VERIFY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install admin-portal dependencies
        working-directory: admin-portal
        run: npm ci

      - name: Verify ephemeral WIF/ADC credentials (no permanent private keys)
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "::error::لم يتم توليد ملف اعتماد Workload Identity المؤقت (GOOGLE_APPLICATION_CREDENTIALS)."
            exit 1
          fi
          python3 - <<'PY' "$GOOGLE_APPLICATION_CREDENTIALS"
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              cred = json.load(f)
          if cred.get("type") != "external_account" or "private_key" in cred:
              print("::error::Unexpected credential type; expected external_account WIF credential without private_key.", file=sys.stderr)
              sys.exit(1)
          print("Verified ephemeral OIDC external_account ADC credential for read-only verification.")
          PY

      - name: Run read-only Firebase Admin verification and publish Arabic summary
        env:
          FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}
          FIREBASE_FIRESTORE_DATABASE_ID: ${{ env.DATABASE_ID }}
          INPUT_EMAIL: ${{ inputs.admin_email }}
        run: |
          set -euo pipefail
          CLEAN_EMAIL=$(printf '%s' "$INPUT_EMAIL" | tr -d '[:space:]')
          VERIFY_JSON="${RUNNER_TEMP}/admin-verify.json"

          set +e
          node admin-portal/server/scripts/manageAdminAccount.js --verify --email "$CLEAN_EMAIL" --json > "$VERIFY_JSON"
          VERIFY_EXIT=$?
          set -e

          if [ "$VERIFY_EXIT" -ne 0 ] && [ "$VERIFY_EXIT" -ne 2 ]; then
            echo "::error::فشل التحقق القرائي من الحساب في Firebase Auth أو Firestore."
            exit "$VERIFY_EXIT"
          fi

          python3 - <<'PY' "$VERIFY_JSON"
          import json, os, sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              final = json.load(f)

          def bool_ar(val):
              return "نعم" if val else "لا"

          uid_val = str(final.get("uid") or "").strip()
          if uid_val:
              print(f"::add-mask::{uid_val}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## تقرير فحص حساب المسؤول على Firebase (قراءة فقط عبر OIDC / WIF)",
              "- **الإجراء المنفذ:** `verify_only` (قراءة فقط — حساب خدمة منفصل)",
              "- **طريقة المصادقة:** GitHub OIDC + Google Cloud Workload Identity Federation (بدون مفاتيح JSON دائمة)",
              f"- **المشروع:** `{final.get('projectId')}`",
              f"- **قاعدة البيانات المسماة:** `{final.get('databaseId')}`",
              f"- **معرّف المستخدم (UID) متوفر:** {bool_ar(bool(uid_val))}",
              f"- **البريد موثق في Auth:** {bool_ar(final.get('emailVerified'))}",
              f"- **حساب Auth معطل:** {bool_ar(final.get('authDisabled'))}",
              "",
              "### حالة الصلاحيات الحالية:",
              f"- **Custom Claim (`abkRole`):** `{final.get('customClaims', {}).get('abkRole') or 'غير مضبوط'}`",
              f"- **وثيقة `/admins/{{uid}}` موجودة:** {bool_ar(final.get('adminsDoc', {}).get('exists'))}",
              f"- **وثيقة `/admins/{{uid}}` نشطة (`active === true`):** {bool_ar(final.get('adminsDoc', {}).get('active'))}",
              f"- **الدور في `/admins/{{uid}}`:** `{final.get('adminsDoc', {}).get('role') or 'غير مضبوط'}`",
              f"- **عدد المسؤولين الفعالين في `/admins`:** {final.get('counts', {}).get('activeAdminCount', 0)} (SUPER_ADMIN: {final.get('counts', {}).get('activeSuperAdminCount', 0)})",
              "",
              "### الجاهزية:",
              f"- **Firestore Rules:** {'جاهز' if final.get('checks', {}).get('readyForFirestore') else 'غير جاهز'}",
              f"- **Storage Rules (`abkRole`):** {'جاهز' if final.get('checks', {}).get('readyForStorage') else 'غير جاهز'}",
              f"- **توافق Custom Claims ووثيقة Firestore:** {'يوجد تعارض' if final.get('checks', {}).get('hasClaimDocConflict') else 'متطابق (لا يوجد تعارض)'}",
              f"- **الصلاحية الكاملة للإدارة:** {'جاهز' if final.get('checks', {}).get('readyForFullAdmin') else 'غير مكتمل'}",
              f"- **جاهزية SUPER_ADMIN الكاملة (`active === true` + `SUPER_ADMIN` + Claim):** {'جاهز' if final.get('checks', {}).get('isSuperAdminReady') else 'غير مكتمل'}",
          ]
          if not final.get("checks", {}).get("readyForFullAdmin"):
              lines.extend([
                  "",
                  "> **الخطوة التالية:** عند الجاهزية، شغّل الـ Workflow يدوياً باختيار `grant_super_admin` وكتابة `CONFIRM_SUPER_ADMIN` باستخدام حساب الخدمة المنفصل المخصص للمنح.",
              ])
          output = "\n".join(lines) + "\n"
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(output)
          print(output)
          PY

      - name: Clean up temporary verification output
        if: always()
        run: rm -f "${RUNNER_TEMP}/admin-verify.json"

  grant-super-admin:
    name: Grant SUPER_ADMIN (Dedicated Least-Privilege Service Account)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'karimaeti52-oss/ABK-Educational-App' &&
      github.actor == github.repository_owner &&
      github.repository_owner == 'karimaeti52-oss' &&
      inputs.action == 'grant_super_admin'
    steps:
      - name: Validate guards, confirmation phrase, and dedicated grant WIF config
        env:
          INPUT_EMAIL: ${{ inputs.admin_email }}
          INPUT_ACTION: ${{ inputs.action }}
          CONFIRM_PHRASE: ${{ inputs.confirm_grant_phrase }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
          WIF_VERIFY_SA: ${{ vars.GCP_WIF_VERIFY_SERVICE_ACCOUNT || secrets.GCP_WIF_VERIFY_SERVICE_ACCOUNT }}
          WIF_GRANT_SA: ${{ vars.GCP_WIF_GRANT_SERVICE_ACCOUNT || secrets.GCP_WIF_GRANT_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::التشغيل مسموح فقط يدوياً عبر workflow_dispatch وعلى فرع refs/heads/main."
            exit 1
          fi
          if [ "${GITHUB_REPOSITORY:-}" != "karimaeti52-oss/ABK-Educational-App" ] || [ "${GITHUB_REPOSITORY_OWNER:-}" != "karimaeti52-oss" ] || [ "${GITHUB_ACTOR:-}" != "${GITHUB_REPOSITORY_OWNER:-}" ]; then
            echo "::error::التشغيل مسموح فقط لمالك المستودع (karimaeti52-oss)."
            exit 1
          fi
          if [ "$INPUT_ACTION" != "grant_super_admin" ]; then
            echo "::error::هذه الوظيفة مخصصة فقط لإجراء grant_super_admin."
            exit 1
          fi
          if [ "$CONFIRM_PHRASE" != "CONFIRM_SUPER_ADMIN" ]; then
            echo "::error::لمنح SUPER_ADMIN يجب كتابة عبارة التأكيد CONFIRM_SUPER_ADMIN بدقة في حقل confirm_grant_phrase."
            exit 1
          fi

          CLEAN_EMAIL=$(printf '%s' "$INPUT_EMAIL" | tr -d '[:space:]')
          if ! printf '%s' "$CLEAN_EMAIL" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
            echo "::error::البريد الإلكتروني المدخل غير صالح."
            exit 1
          fi
          echo "::add-mask::$CLEAN_EMAIL"

          CLEAN_WIF_PROVIDER=$(printf '%s' "${WIF_PROVIDER:-}" | tr -d '[:space:]')
          CLEAN_WIF_GRANT_SA=$(printf '%s' "${WIF_GRANT_SA:-}" | tr -d '[:space:]')
          CLEAN_WIF_VERIFY_SA=$(printf '%s' "${WIF_VERIFY_SA:-}" | tr -d '[:space:]')

          if [ -z "$CLEAN_WIF_PROVIDER" ] || [ -z "$CLEAN_WIF_GRANT_SA" ]; then
            {
              echo "### إعداد حساب المنح المنفصل عبر Workload Identity Federation مطلوب"
              echo "يستخدم وضع \`grant_super_admin\` حساب خدمة منفصلاً تماماً عن حساب \`verify_only\` وبأدنى صلاحيات مخصصة لازمة."
              echo ""
              echo "أضف في **Settings → Secrets and variables → Actions**:"
              echo "- \`GCP_WIF_PROVIDER\`: مسار مزود WIF الموجود مسبقاً."
              echo "- \`GCP_WIF_GRANT_SERVICE_ACCOUNT\`: بريد حساب الخدمة المنفصل المخصص للمنح فقط."
              echo ""
              echo "الصلاحيات الموصى بها في دور IAM مخصص لهذا الحساب (بدون أي صلاحية حذف):"
              echo "- Auth: \`firebaseauth.users.get\` و \`firebaseauth.users.update\` فقط (بدون create/delete أو تعديل configs)."
              echo "- Firestore: \`datastore.entities.get\` و \`datastore.entities.list\` و \`datastore.entities.create\` و \`datastore.entities.update\` فقط (بدون \`datastore.entities.delete\`)."
              echo "- تنبيه: صلاحيات IAM على Firestore لا تحصر الوصول بمجموعة \`admins\` وحدها، وAdmin SDK يتجاوز Firestore Security Rules."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing GCP_WIF_PROVIDER or GCP_WIF_GRANT_SERVICE_ACCOUNT."
            exit 1
          fi

          if ! printf '%s' "$CLEAN_WIF_PROVIDER" | grep -Eq '^projects/[0-9]+/locations/[a-z0-9-]+/workloadIdentityPools/[A-Za-z0-9._-]+/providers/[A-Za-z0-9._-]+$'; then
            echo "::error::تنسيق GCP_WIF_PROVIDER غير صالح."
            exit 1
          fi
          if ! printf '%s' "$CLEAN_WIF_GRANT_SA" | grep -Eq '^[^@[:space:]]+@[^@[:space:]]+\.iam\.gserviceaccount\.com$'; then
            echo "::error::تنسيق GCP_WIF_GRANT_SERVICE_ACCOUNT غير صالح."
            exit 1
          fi
          if [ -n "$CLEAN_WIF_VERIFY_SA" ] && [ "$CLEAN_WIF_GRANT_SA" = "$CLEAN_WIF_VERIFY_SA" ]; then
            echo "::error::يجب فصل حسابات الخدمة: لا يجوز أن يطابق GCP_WIF_GRANT_SERVICE_ACCOUNT حساب القراءة فقط GCP_WIF_VERIFY_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate via GitHub OIDC (Dedicated Grant Service Account)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_GRANT_SERVICE_ACCOUNT || secrets.GCP_WIF_GRANT_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
          cleanup_credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-portal/package-lock.json

      - name: Install admin-portal dependencies
        working-directory: admin-portal
        run: npm ci

      - name: Verify ephemeral WIF/ADC credentials (no permanent private keys)
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ] || [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "::error::لم يتم توليد ملف اعتماد Workload Identity المؤقت (GOOGLE_APPLICATION_CREDENTIALS)."
            exit 1
          fi
          python3 - <<'PY' "$GOOGLE_APPLICATION_CREDENTIALS"
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              cred = json.load(f)
          if cred.get("type") != "external_account" or "private_key" in cred:
              print("::error::Unexpected credential type; expected external_account WIF credential without private_key.", file=sys.stderr)
              sys.exit(1)
          print("Verified ephemeral OIDC external_account ADC credential for grant job.")
          PY

      - name: Verify account eligibility and grant SUPER_ADMIN via Admin SDK
        env:
          FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}
          FIREBASE_FIRESTORE_DATABASE_ID: ${{ env.DATABASE_ID }}
          INPUT_EMAIL: ${{ inputs.admin_email }}
        run: |
          set -euo pipefail
          CLEAN_EMAIL=$(printf '%s' "$INPUT_EMAIL" | tr -d '[:space:]')
          BEFORE_JSON="${RUNNER_TEMP}/admin-before.json"
          AFTER_JSON="${RUNNER_TEMP}/admin-after.json"

          set +e
          node admin-portal/server/scripts/manageAdminAccount.js --verify --email "$CLEAN_EMAIL" --json > "$BEFORE_JSON"
          VERIFY_EXIT=$?
          set -e

          if [ "$VERIFY_EXIT" -ne 0 ] && [ "$VERIFY_EXIT" -ne 2 ]; then
            echo "::error::فشل التحقق المسبق من الحساب في Firebase Auth أو Firestore قبل المنح."
            exit "$VERIFY_EXIT"
          fi

          python3 - <<'PY' "$BEFORE_JSON"
          import json, sys
          with open(sys.argv[1], "r", encoding="utf-8") as f:
              data = json.load(f)
          if not data.get("uid"):
              print("::error::الحساب غير موجود في Firebase Auth.", file=sys.stderr)
              sys.exit(1)
          if not data.get("emailVerified"):
              print("::error::لن يتم منح SUPER_ADMIN لأن البريد الإلكتروني غير موثق في Firebase Auth (emailVerified=false).", file=sys.stderr)
              sys.exit(1)
          if data.get("authDisabled"):
              print("::error::لن يتم منح SUPER_ADMIN لأن الحساب معطل في Firebase Auth.", file=sys.stderr)
              sys.exit(1)
          PY

          node admin-portal/server/scripts/manageAdminAccount.js --grant --email "$CLEAN_EMAIL" --role SUPER_ADMIN --json > "$AFTER_JSON"

          python3 - <<'PY' "$BEFORE_JSON" "$AFTER_JSON"
          import json, os, sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              before = json.load(f)
          with open(sys.argv[2], "r", encoding="utf-8") as f:
              final = json.load(f)

          def bool_ar(val):
              return "نعم" if val else "لا"

          uid_val = str(final.get("uid") or "").strip()
          if uid_val:
              print(f"::add-mask::{uid_val}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = [
              "## تقرير منح صلاحية SUPER_ADMIN على Firebase (عبر OIDC / WIF)",
              "- **الإجراء المنفذ:** `grant_super_admin` (حساب خدمة منفصل بأدنى صلاحيات مخصصة)",
              "- **طريقة المصادقة:** GitHub OIDC + Google Cloud Workload Identity Federation (بدون مفاتيح JSON دائمة)",
              f"- **المشروع:** `{final.get('projectId')}`",
              f"- **قاعدة البيانات المسماة:** `{final.get('databaseId')}`",
              f"- **معرّف المستخدم (UID) متوفر:** {bool_ar(bool(uid_val))}",
              f"- **البريد موثق في Auth:** {bool_ar(final.get('emailVerified'))}",
              f"- **Custom Claim (`abkRole`):** `{before.get('customClaims', {}).get('abkRole') or 'غير مضبوط'}` → `{final.get('customClaims', {}).get('abkRole')}`",
              f"- **وثيقة `/admins/{{uid}}`:** موجودة={bool_ar(final.get('adminsDoc', {}).get('exists'))} | نشطة={bool_ar(final.get('adminsDoc', {}).get('active'))} | الدور=`{final.get('adminsDoc', {}).get('role')}`",
              f"- **الجاهزية الكاملة للإدارة:** {'جاهز' if final.get('checks', {}).get('readyForFullAdmin') else 'غير مكتمل'}",
              "",
              "> يرجى تسجيل الخروج ثم إعادة الدخول في لوحة الإدارة وتطبيق Android لتحديث الـ ID Token.",
          ]
          output = "\n".join(lines) + "\n"
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as sf:
                  sf.write(output)
          print(output)
          PY

      - name: Clean up temporary grant outputs
        if: always()
        run: rm -f "${RUNNER_TEMP}/admin-before.json" "${RUNNER_TEMP}/admin-after.json"

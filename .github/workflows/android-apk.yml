name: Build Midad Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_ready_to_publish:
        description: 'Confirm Cloudflare R2 Worker & firestore.rules are deployed and APK signature verification passed before publishing v1.1.1'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release-v1-1-1:
    name: Build, Test & Publish Release v1.1.1 (Midad)
    runs-on: ubuntu-latest

    steps:
      - name: Record workflow build start time
        id: build_meta
        run: |
          START_EPOCH=$(date -u +%s)
          START_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "start_epoch=$START_EPOCH" >> "$GITHUB_OUTPUT"
          echo "start_iso=$START_ISO" >> "$GITHUB_OUTPUT"
          echo "Build started at (UTC): $START_ISO ($START_EPOCH)"

      - name: Checkout latest repository commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pre-flight checks (source integrity, v1.1.1 check, v1.0.0 baseline inspection)
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TARGET_TAG="v1.1.1"
          OLD_TAG="v1.0.0"

          echo "Checked out branch/ref: ${{ github.ref_name }}"
          git log -1 --format="Commit: %H%nAuthor Date: %cI%nSubject: %s"

          if ! grep -q "ensureFirebaseInitialized" app/src/main/java/com/example/ui/AbkAppNavigation.kt || \
             ! grep -q "ensureFirebaseInitialized" app/src/main/java/com/example/data/firebase/AuthHelper.kt || \
             ! grep -q "VideoPlaybackSupport" app/src/main/java/com/example/ui/screens/VideoPlayerScreen.kt; then
            echo "::error::Checked-out source files are missing expected Firebase init or VideoPlaybackSupport updates."
            exit 1
          fi

          # Preserve v1.0.0 and v1.1.0 untouched; check if v1.1.1 already exists
          RELEASE_EXISTS="false"
          if gh api "repos/${REPO}/releases/tags/${TARGET_TAG}" >/dev/null 2>&1 || \
             gh api "repos/${REPO}/git/ref/tags/${TARGET_TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS="true"
            echo "Release or tag '${TARGET_TAG}' already exists on ${REPO}. Will run full build, tests, and signature verification without modifying existing releases."
          else
            echo "Verified neither tag nor release '${TARGET_TAG}' exists yet."
          fi
          echo "release_exists=${RELEASE_EXISTS}" >> "$GITHUB_OUTPUT"

          # Inspect v1.0.0 APK (mandatory baseline) and v1.1.0 APK (if present) read-only (never delete or modify existing releases)
          OLD_DIR="${RUNNER_TEMP}/old_releases"
          mkdir -p "$OLD_DIR"

          AAPT2_BIN=$(command -v aapt2 || find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)
          APKSIGNER_BIN=$(command -v apksigner || find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$AAPT2_BIN" ] || [ -z "$APKSIGNER_BIN" ]; then
            echo "::error::aapt2 or apksigner not found on runner."
            exit 1
          fi

          inspect_baseline_release() {
            local TAG="$1"
            local ASSET_PATTERN="$2"
            local TARGET_FILE="${OLD_DIR}/${TAG}.apk"
            gh release download "$TAG" --pattern "$ASSET_PATTERN" --repo "$REPO" --output "$TARGET_FILE" --clobber
            if [ ! -s "$TARGET_FILE" ]; then
              echo "::error::Failed to download baseline ${TAG}/${ASSET_PATTERN} for pre-flight verification."
              exit 1
            fi
            local BADGING
            BADGING=$("$AAPT2_BIN" dump badging "$TARGET_FILE")
            local PKG VC VN CERTS SHA1 SHA256
            PKG=$(printf '%s\n' "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n1)
            VC=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
            VN=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
            CERTS=$("$APKSIGNER_BIN" verify --print-certs "$TARGET_FILE")
            SHA1=$(printf '%s\n' "$CERTS" | awk -F'SHA-1 digest:' '/SHA-1 digest:/ {gsub(/[[:space:]]/, "", $2); print tolower($2); exit}')
            SHA256=$(printf '%s\n' "$CERTS" | awk -F'SHA-256 digest:' '/SHA-256 digest:/ {gsub(/[[:space:]]/, "", $2); print tolower($2); exit}')
            if [ -z "$VC" ] || [ -z "$SHA1" ] || [ -z "$SHA256" ]; then
              echo "::error::Could not extract versionCode or certificate digests from baseline ${TAG}."
              exit 1
            fi
            echo "${PKG}|${VC}|${VN}|${SHA1}|${SHA256}"
          }

          IFS='|' read -r OLD_PKG OLD_VC OLD_VN OLD_SHA1_HEX OLD_SHA256_HEX <<< "$(inspect_baseline_release "$OLD_TAG" "ABK.apk")"
          MAX_OLD_VC="$OLD_VC"

          if gh api "repos/${REPO}/releases/tags/v1.1.0" >/dev/null 2>&1; then
            IFS='|' read -r V110_PKG V110_VC V110_VN V110_SHA1_HEX V110_SHA256_HEX <<< "$(inspect_baseline_release "v1.1.0" "*.apk")"
            if [ "$V110_PKG" != "$OLD_PKG" ] || [ "$V110_SHA1_HEX" != "$OLD_SHA1_HEX" ] || [ "$V110_SHA256_HEX" != "$OLD_SHA256_HEX" ]; then
              echo "::error::Existing v1.1.0 release differs in package or signing certificate from v1.0.0 baseline!"
              exit 1
            fi
            if [ "$V110_VC" -gt "$MAX_OLD_VC" ]; then
              MAX_OLD_VC="$V110_VC"
            fi
            echo "Baseline v1.1.0 verified: package=${V110_PKG}, versionCode=${V110_VC}, versionName=${V110_VN}, SHA-1=${V110_SHA1_HEX}"
          fi

          echo "old_pkg=${OLD_PKG}" >> "$GITHUB_OUTPUT"
          echo "old_version_code=${MAX_OLD_VC}" >> "$GITHUB_OUTPUT"
          echo "old_version_name=${OLD_VN}" >> "$GITHUB_OUTPUT"
          echo "old_sha1_hex=${OLD_SHA1_HEX}" >> "$GITHUB_OUTPUT"
          echo "old_sha256_hex=${OLD_SHA256_HEX}" >> "$GITHUB_OUTPUT"

          echo "Baseline ${OLD_TAG} verified: package=${OLD_PKG}, maxExistingVersionCode=${MAX_OLD_VC}, SHA-1=${OLD_SHA1_HEX}"

      - name: Set up Node.js 20 for Security & Cloud Storage Gates
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Security, Storage Quotas & Admin Portal / Worker Tests
        run: |
          set -euo pipefail
          if grep -rnE "karimaeti07@gmail\.com|BOOTSTRAPPED_ADMIN_EMAIL" \
            firestore.rules storage.rules firestore.test.js \
            cloudflare-worker admin-portal/src admin-portal/server app/src \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build; then
            echo "::error::Hardcoded personal admin email literal found in source or rules."
            exit 1
          fi
          if ! grep -q 'READ_ACCESS_MODE = "authenticated"' cloudflare-worker/wrangler.toml || \
             ! grep -q 'DEFAULT_R2_LIMIT_GB = "10"' cloudflare-worker/wrangler.toml || \
             ! grep -q 'B2_ENABLED = "false"' cloudflare-worker/wrangler.toml; then
            echo "::error::cloudflare-worker/wrangler.toml does not match required READ_ACCESS_MODE or 10 GB R2 / B2 disabled defaults."
            exit 1
          fi
          node --test cloudflare-worker/tests/worker.test.js
          npm --prefix admin-portal ci
          npm --prefix admin-portal test
          npm --prefix admin-portal run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare temporary Release signing keystore from GitHub Secrets
        id: keystore_prep
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          OLD_SHA1_HEX: ${{ steps.baseline.outputs.old_sha1_hex }}
          OLD_SHA256_HEX: ${{ steps.baseline.outputs.old_sha256_hex }}
        run: |
          set +x
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing required GitHub Secret DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          if [ -z "$DEBUG_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing required GitHub Secret DEBUG_KEYSTORE_PASSWORD."
            exit 1
          fi

          echo "::add-mask::$DEBUG_KEYSTORE_PASSWORD"

          REL_KEYSTORE="${RUNNER_TEMP}/release-compat.keystore"
          rm -f "$REL_KEYSTORE"

          if ! printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$REL_KEYSTORE" || [ ! -s "$REL_KEYSTORE" ]; then
            rm -f "$REL_KEYSTORE"
            echo "::error::Failed to decode DEBUG_KEYSTORE_BASE64 into a valid keystore."
            exit 1
          fi

          export KS_PASS="$DEBUG_KEYSTORE_PASSWORD"
          if ! keytool -list -keystore "$REL_KEYSTORE" -storepass:env KS_PASS -alias androiddebugkey >/dev/null 2>&1; then
            rm -f "$REL_KEYSTORE"
            echo "::error::Provided DEBUG_KEYSTORE_PASSWORD did not unlock alias 'androiddebugkey' in DEBUG_KEYSTORE_BASE64."
            exit 1
          fi

          # Rename alias in temporary runner copy only so Gradle signingConfigs.release (keyAlias="upload") uses exact v1.0.0 key & cert
          if ! keytool -changealias -alias androiddebugkey -destalias upload -keystore "$REL_KEYSTORE" -storepass:env KS_PASS -keypass:env KS_PASS >/dev/null 2>&1; then
            rm -f "$REL_KEYSTORE"
            echo "::error::Failed to re-alias 'androiddebugkey' to 'upload' on temporary keystore copy."
            exit 1
          fi

          KS_CERT_INFO=$(keytool -list -v -keystore "$REL_KEYSTORE" -storepass:env KS_PASS -alias upload 2>/dev/null)
          KS_SHA1_HEX=$(printf '%s\n' "$KS_CERT_INFO" | awk -F'SHA1:' '/SHA1:/ {gsub(/[:[:space:]]/, "", $2); print tolower($2); exit}')
          KS_SHA256_HEX=$(printf '%s\n' "$KS_CERT_INFO" | awk -F'SHA256:' '/SHA256:/ {gsub(/[:[:space:]]/, "", $2); print tolower($2); exit}')

          if [ "$KS_SHA1_HEX" != "$OLD_SHA1_HEX" ] || [ "$KS_SHA256_HEX" != "$OLD_SHA256_HEX" ]; then
            rm -f "$REL_KEYSTORE"
            echo "::error::Temporary keystore certificate under alias 'upload' does not match baseline v1.0.0 certificate!"
            exit 1
          fi

          echo "release_keystore_path=${REL_KEYSTORE}" >> "$GITHUB_OUTPUT"
          echo "Verified temporary PKCS12 copy under alias 'upload' preserves exact v1.0.0 SHA-1 & SHA-256."

      - name: Prepare and validate google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set +x
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing; Firebase and Google Sign-In require it."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          matched = [
              c for c in clients
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.aistudio.abkedu.kpmzqx"
          ]
          if not matched:
              print("::error::app/google-services.json does not match package_name com.aistudio.abkedu.kpmzqx", file=sys.stderr)
              sys.exit(1)
          web_clients = [
              o for o in matched[0].get("oauth_client", [])
              if o.get("client_type") == 3 and o.get("client_id")
          ]
          if not web_clients:
              print("::error::app/google-services.json is missing OAuth Web Client (client_type: 3) needed for default_web_client_id", file=sys.stderr)
              sys.exit(1)
          print("Verified google-services.json for com.aistudio.abkedu.kpmzqx with OAuth Web Client.")
          PY

      - name: Grant execute permission and remove stale APK outputs
        run: |
          chmod +x gradlew
          rm -f Midad.apk Midad-v1.1.1-release.apk app/build/outputs/apk/release/app-release.apk

      - name: Run Android Unit & Robolectric Tests (:app:testDebugUnitTest)
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed Release APK (:app:assembleRelease)
        env:
          KEYSTORE_PATH: ${{ steps.keystore_prep.outputs.release_keystore_path }}
          STORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set +x
          echo "::add-mask::$STORE_PASSWORD"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify Release APK signature, Firebase config, and package metadata (blocking gate)
        id: apk_info
        env:
          START_EPOCH: ${{ steps.build_meta.outputs.start_epoch }}
          OLD_PKG: ${{ steps.baseline.outputs.old_pkg }}
          OLD_VC: ${{ steps.baseline.outputs.old_version_code }}
          OLD_SHA1_HEX: ${{ steps.baseline.outputs.old_sha1_hex }}
          OLD_SHA256_HEX: ${{ steps.baseline.outputs.old_sha256_hex }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          PERMANENT_ASSET_NAME="Midad.apk"
          VERSIONED_ASSET_NAME="Midad-v1.1.1-release.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected Release APK was not generated at $APK_PATH"
            exit 1
          fi

          APK_MTIME=$(stat -c %Y "$APK_PATH")
          APK_DATE_UTC=$(date -u -d "@$APK_MTIME" +"%Y-%m-%dT%H:%M:%SZ")
          if [ "$APK_MTIME" -lt "$START_EPOCH" ]; then
            echo "::error::$APK_PATH timestamp ($APK_DATE_UTC) is older than workflow start time!"
            exit 1
          fi

          VALUES_XML="app/build/generated/res/processReleaseGoogleServices/values/values.xml"
          if [ ! -f "$VALUES_XML" ] || ! grep -q 'name="default_web_client_id"' "$VALUES_XML"; then
            echo "::error::R.string.default_web_client_id was not generated in Release build ($VALUES_XML)."
            exit 1
          fi

          cp -f "$APK_PATH" "$PERMANENT_ASSET_NAME"
          cp -f "$APK_PATH" "$VERSIONED_ASSET_NAME"
          SRC_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          PERM_SHA256=$(sha256sum "$PERMANENT_ASSET_NAME" | awk '{print $1}')
          VER_SHA256=$(sha256sum "$VERSIONED_ASSET_NAME" | awk '{print $1}')
          if [ "$SRC_SHA256" != "$PERM_SHA256" ] || [ "$SRC_SHA256" != "$VER_SHA256" ]; then
            echo "::error::Copied APK checksum mismatch against $APK_PATH"
            exit 1
          fi

          APK_SIZE_BYTES=$(stat -c %s "$PERMANENT_ASSET_NAME")
          APK_SIZE_HUMAN=$(ls -lh "$PERMANENT_ASSET_NAME" | awk '{print $5}')

          APKSIGNER_BIN=$(command -v apksigner || find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          AAPT2_BIN=$(command -v aapt2 || find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER_BIN" ] || [ -z "$AAPT2_BIN" ]; then
            echo "::error::apksigner or aapt2 not found on runner."
            exit 1
          fi

          if ! APK_CERT_INFO=$("$APKSIGNER_BIN" verify --verbose --print-certs "$PERMANENT_ASSET_NAME" 2>&1); then
            echo "::error::apksigner verification failed for $PERMANENT_ASSET_NAME."
            printf '%s\n' "$APK_CERT_INFO"
            exit 1
          fi

          APK_CERT_SHA1_HEX=$(printf '%s\n' "$APK_CERT_INFO" | awk -F'SHA-1 digest:' '/SHA-1 digest:/ {gsub(/[[:space:]]/, "", $2); print tolower($2); exit}')
          APK_CERT_SHA256_HEX=$(printf '%s\n' "$APK_CERT_INFO" | awk -F'SHA-256 digest:' '/SHA-256 digest:/ {gsub(/[[:space:]]/, "", $2); print tolower($2); exit}')
          if [ -z "$APK_CERT_SHA1_HEX" ] || [ -z "$APK_CERT_SHA256_HEX" ]; then
            echo "::error::Could not parse SHA-1 or SHA-256 certificate digest from apksigner output."
            exit 1
          fi

          APK_CERT_SHA1=$(printf '%s' "$APK_CERT_SHA1_HEX" | sed -E 's/../\U&:/g; s/:$//')
          APK_CERT_SHA256=$(printf '%s' "$APK_CERT_SHA256_HEX" | sed -E 's/../\U&:/g; s/:$//')

          if [ "$APK_CERT_SHA1_HEX" != "$OLD_SHA1_HEX" ] || [ "$APK_CERT_SHA256_HEX" != "$OLD_SHA256_HEX" ]; then
            echo "::error::Release APK certificate mismatch against v1.0.0! new_sha1=${APK_CERT_SHA1_HEX}, v1_0_0_sha1=${OLD_SHA1_HEX}"
            exit 1
          fi

          EXPECTED_FIREBASE_SHA1_LIST=$(python3 - <<'PY'
          import json
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          hashes = []
          for c in data.get("client", []):
              for o in c.get("oauth_client", []):
                  h = o.get("android_info", {}).get("certificate_hash")
                  if h:
                      hashes.append(h.strip().lower())
          print(",".join(dict.fromkeys(hashes)))
          PY
          )

          if ! printf '%s' "$EXPECTED_FIREBASE_SHA1_LIST" | grep -qi "$APK_CERT_SHA1_HEX"; then
            echo "::error::Release APK SHA-1 (${APK_CERT_SHA1_HEX}) is not registered in app/google-services.json (${EXPECTED_FIREBASE_SHA1_LIST})."
            exit 1
          fi

          NEW_BADGING=$("$AAPT2_BIN" dump badging "$PERMANENT_ASSET_NAME")
          NEW_PKG=$(printf '%s\n' "$NEW_BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p" | head -n1)
          NEW_VC=$(printf '%s\n' "$NEW_BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
          NEW_VN=$(printf '%s\n' "$NEW_BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          NEW_LABEL=$(printf '%s\n' "$NEW_BADGING" | sed -n "s/^application-label:'\([^']*\)'.*/\1/p" | head -n1)

          if [ "$NEW_PKG" != "com.aistudio.abkedu.kpmzqx" ] || [ "$NEW_PKG" != "$OLD_PKG" ]; then
            echo "::error::Unexpected package name '${NEW_PKG}' (expected 'com.aistudio.abkedu.kpmzqx')."
            exit 1
          fi
          if [ -z "$NEW_VC" ] || [ "$NEW_VC" -le "$OLD_VC" ]; then
            echo "::error::New versionCode (${NEW_VC}) must be strictly greater than v1.0.0 versionCode (${OLD_VC})."
            exit 1
          fi
          if [ "$NEW_VC" != "3" ] || [ "$NEW_VN" != "1.1.1" ]; then
            echo "::error::Expected versionCode=3 and versionName=1.1.1, found versionCode=${NEW_VC}, versionName=${NEW_VN}."
            exit 1
          fi
          if [ "$NEW_LABEL" != "مداد التعليمية" ]; then
            echo "::error::Expected application-label='مداد التعليمية', found '${NEW_LABEL}'."
            exit 1
          fi

          echo "permanent_asset=${PERMANENT_ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "versioned_asset=${VERSIONED_ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${PERM_SHA256}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${APK_SIZE_BYTES}" >> "$GITHUB_OUTPUT"
          echo "size_human=${APK_SIZE_HUMAN}" >> "$GITHUB_OUTPUT"
          echo "build_time_utc=${APK_DATE_UTC}" >> "$GITHUB_OUTPUT"
          echo "cert_sha1=${APK_CERT_SHA1}" >> "$GITHUB_OUTPUT"
          echo "cert_sha1_hex=${APK_CERT_SHA1_HEX}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${APK_CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256_hex=${APK_CERT_SHA256_HEX}" >> "$GITHUB_OUTPUT"
          echo "version_code=${NEW_VC}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NEW_VN}" >> "$GITHUB_OUTPUT"
          echo "app_label=${NEW_LABEL}" >> "$GITHUB_OUTPUT"

          echo "=== Verified Release APK Summary ==="
          echo "APK Assets       : ${PERMANENT_ASSET_NAME}, ${VERSIONED_ASSET_NAME}"
          echo "Package          : ${NEW_PKG}"
          echo "Version          : ${NEW_VN} (versionCode=${NEW_VC}, v1.0.0=${OLD_VC})"
          echo "App Label        : ${NEW_LABEL}"
          echo "Size             : ${APK_SIZE_BYTES} bytes (${APK_SIZE_HUMAN})"
          echo "APK File SHA-256 : ${PERM_SHA256}"
          echo "APK Cert SHA-1   : ${APK_CERT_SHA1}"
          echo "APK Cert SHA-256 : ${APK_CERT_SHA256}"

      - name: Create new GitHub Release v1.1.1 (preserving v1.0.0 and v1.1.0) and verify assets
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_ready_to_publish == true && steps.baseline.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PERMANENT_ASSET: ${{ steps.apk_info.outputs.permanent_asset }}
          VERSIONED_ASSET: ${{ steps.apk_info.outputs.versioned_asset }}
          LOCAL_SIZE_BYTES: ${{ steps.apk_info.outputs.size_bytes }}
          LOCAL_SIZE_HUMAN: ${{ steps.apk_info.outputs.size_human }}
          LOCAL_SHA256: ${{ steps.apk_info.outputs.sha256 }}
          BUILD_TIME_UTC: ${{ steps.apk_info.outputs.build_time_utc }}
          START_ISO: ${{ steps.build_meta.outputs.start_iso }}
          CERT_SHA1: ${{ steps.apk_info.outputs.cert_sha1 }}
          CERT_SHA1_HEX: ${{ steps.apk_info.outputs.cert_sha1_hex }}
          CERT_SHA256: ${{ steps.apk_info.outputs.cert_sha256 }}
          CERT_SHA256_HEX: ${{ steps.apk_info.outputs.cert_sha256_hex }}
          VERSION_CODE: ${{ steps.apk_info.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk_info.outputs.version_name }}
          OLD_VC: ${{ steps.baseline.outputs.old_version_code }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="v1.1.1"

          if gh api "repos/${REPO}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::Release ${TAG} appeared concurrently; skipping creation without overwriting."
            exit 0
          fi

          gh release create "$TAG" "$PERMANENT_ASSET" "$VERSIONED_ASSET" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "مداد التعليمية v1.1.1" \
            --notes "تحديث رسمي لمنصة مداد التعليمية (طريقك نحو التفوق) — versionCode ${VERSION_CODE}، يتضمن إصلاح مشغل الفيديو ودعم البث عبر Cloudflare R2 وتحسين التحديث التلقائي (SHA-256: \`${LOCAL_SHA256}\`). متوافق للترقية المباشرة فوق v1.0.0 و v1.1.0 بنفس بصمة التوقيع (SHA-1: ${CERT_SHA1})."

          VERIFIED=0
          for attempt in 1 2 3; do
            RELEASE_AFTER=$(gh api "repos/${REPO}/releases/tags/${TAG}")
            if python3 - <<'PY' "$RELEASE_AFTER" "$PERMANENT_ASSET" "$VERSIONED_ASSET" "$LOCAL_SIZE_BYTES" "$LOCAL_SHA256" "$START_ISO"
          import datetime, json, sys

          rel = json.loads(sys.argv[1])
          expected_names = [sys.argv[2], sys.argv[3]]
          local_size = int(sys.argv[4])
          local_sha = sys.argv[5].lower()
          start_dt = datetime.datetime.fromisoformat(sys.argv[6].replace("Z", "+00:00"))

          for asset_name in expected_names:
              assets = [a for a in rel.get("assets", []) if a.get("name") == asset_name]
              if len(assets) != 1:
                  print(f"Expected 1 asset named {asset_name}, found {len(assets)}", file=sys.stderr)
                  sys.exit(1)
              asset = assets[0]
              remote_size = int(asset.get("size", -1))
              updated_raw = asset.get("updated_at", "")
              updated_dt = datetime.datetime.fromisoformat(updated_raw.replace("Z", "+00:00"))
              digest = (asset.get("digest") or "").lower()
              download_url = asset.get("browser_download_url", "")

              if remote_size != local_size:
                  print(f"Size mismatch for {asset_name}: remote={remote_size} vs local={local_size}", file=sys.stderr)
                  sys.exit(1)
              if updated_dt < start_dt - datetime.timedelta(seconds=5):
                  print(f"Timestamp mismatch for {asset_name}: {updated_raw}", file=sys.stderr)
                  sys.exit(1)
              if digest and digest != f"sha256:{local_sha}":
                  print(f"Digest mismatch for {asset_name}: {digest} vs sha256:{local_sha}", file=sys.stderr)
                  sys.exit(1)
              print(f"Verified Release {rel.get('tag_name')} -> {download_url} ({remote_size} bytes)")
          PY
            then
              VERIFIED=1
              break
            fi
            sleep 3
          done

          if [ "$VERIFIED" -ne 1 ]; then
            echo "::error::Failed to verify uploaded release assets on ${TAG}."
            exit 1
          fi

          {
            echo "### Midad Release APK Build & Verification (${TAG})"
            echo "- **Tag**: \`${TAG}\` (v1.0.0 and v1.1.0 preserved intact)"
            echo "- **Version**: \`${VERSION_NAME}\` (\`versionCode=${VERSION_CODE}\` > v1.0.0 \`versionCode=${OLD_VC}\`)"
            echo "- **Application ID**: \`com.aistudio.abkedu.kpmzqx\`"
            echo "- **APK Signing Cert SHA-1 (Matched v1.0.0 & Firebase)**: \`${CERT_SHA1}\` (\`${CERT_SHA1_HEX}\`)"
            echo "- **APK Signing Cert SHA-256**: \`${CERT_SHA256}\` (\`${CERT_SHA256_HEX}\`)"
            echo "- **APK Size**: \`${LOCAL_SIZE_BYTES} bytes\` (\`${LOCAL_SIZE_HUMAN}\`)"
            echo "- **APK File SHA-256 (for appConfig/android_release)**: \`${LOCAL_SHA256}\`"
            echo "- **Build Time (UTC)**: \`${BUILD_TIME_UTC}\`"
            echo "- **Permanent Latest APK URL**: https://github.com/${REPO}/releases/latest/download/${PERMANENT_ASSET}"
            echo "- **Versioned Release URL**: https://github.com/${REPO}/releases/download/${TAG}/${VERSIONED_ASSET}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload built & verified APK workflow artifact (when release publish is deferred or tag already exists)
        if: github.event_name != 'workflow_dispatch' || inputs.confirm_ready_to_publish != true || steps.baseline.outputs.release_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: midad-release-v1.1.1-apk
          path: |
            Midad.apk
            Midad-v1.1.1-release.apk
          retention-days: 7

      - name: Record deferred release status summary
        if: (github.event_name != 'workflow_dispatch' || inputs.confirm_ready_to_publish != true) && steps.baseline.outputs.release_exists != 'true'
        env:
          CERT_SHA1: ${{ steps.apk_info.outputs.cert_sha1 }}
          LOCAL_SHA256: ${{ steps.apk_info.outputs.sha256 }}
          VERSION_CODE: ${{ steps.apk_info.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk_info.outputs.version_name }}
        run: |
          {
            echo "### Midad Release APK Dry-Run Verified (Release Publish Gated)"
            echo "- **Status**: Built & signature-verified (\`v${VERSION_NAME}\` / \`versionCode=${VERSION_CODE}\`), uploaded as workflow artifact only."
            echo "- **Releases Preserved**: \`v1.0.0\` and \`v1.1.0\` untouched; \`v1.1.1\` NOT published automatically."
            echo "- **To Publish v1.1.1**: Confirm Worker + \`firestore.rules\` are deployed, then trigger \`workflow_dispatch\` with \`confirm_ready_to_publish=true\`."
            echo "- **APK Cert SHA-1 (Matched v1.0.0)**: \`${CERT_SHA1}\`"
            echo "- **APK File SHA-256**: \`${LOCAL_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up temporary keystores and local build copies
        if: always()
        run: |
          rm -rf "${RUNNER_TEMP}/release-compat.keystore" "${RUNNER_TEMP}/old_releases" Midad.apk Midad-v1.1.1-release.apk

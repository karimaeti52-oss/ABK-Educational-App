name: Build ABK Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build Debug APK and Upload to v1.0.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub Secret."
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated debug.keystore automatically via keytool."
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Prepare and validate google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json. Sync app/google-services.json or set the GOOGLE_SERVICES_JSON repository secret so Google Services generates R.string.default_web_client_id."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          matched = [
              c for c in clients
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.aistudio.abkedu.kpmzqx"
          ]
          if not matched:
              print("::error::app/google-services.json does not match package_name com.aistudio.abkedu.kpmzqx", file=sys.stderr)
              sys.exit(1)
          web_clients = [
              o for o in matched[0].get("oauth_client", [])
              if o.get("client_type") == 3 and o.get("client_id")
          ]
          if not web_clients:
              print("::error::app/google-services.json is missing OAuth Web Client (client_type: 3) needed for default_web_client_id", file=sys.stderr)
              sys.exit(1)
          print("Verified google-services.json for com.aistudio.abkedu.kpmzqx with OAuth Web Client.")
          PY

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ABK Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify generated default_web_client_id and ABK.apk
        run: |
          VALUES_XML="app/build/generated/res/processDebugGoogleServices/values/values.xml"
          if [ ! -f "$VALUES_XML" ] || ! grep -q 'name="default_web_client_id"' "$VALUES_XML"; then
            echo "::error::R.string.default_web_client_id was not generated in $VALUES_XML"
            exit 1
          fi
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK was not generated at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" ABK.apk
          ls -lh ABK.apk

      - name: Verify existing v1.0.0 release and upload ABK.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null
          gh release upload v1.0.0 ABK.apk --clobber --repo "${{ github.repository }}"

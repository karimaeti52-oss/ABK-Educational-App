name: Build ABK Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build Debug APK and Upload to v1.0.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build ABK Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify APK exists and rename to ABK.apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK was not generated at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" ABK.apk
          ls -lh ABK.apk

      - name: Verify existing v1.0.0 release and upload ABK.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null
          gh release upload v1.0.0 ABK.apk --clobber --repo "${{ github.repository }}"

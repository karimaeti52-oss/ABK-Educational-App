name: Build ABK Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build Debug APK and Upload to v1.0.0
    runs-on: ubuntu-latest

    steps:
      - name: Record workflow build start time
        id: build_meta
        run: |
          START_EPOCH=$(date -u +%s)
          START_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "start_epoch=$START_EPOCH" >> "$GITHUB_OUTPUT"
          echo "start_iso=$START_ISO" >> "$GITHUB_OUTPUT"
          echo "Build started at (UTC): $START_ISO ($START_EPOCH)"

      - name: Checkout latest repository commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify latest project files include Firebase startup fix
        run: |
          echo "Checked out branch/ref: ${{ github.ref_name }}"
          git log -1 --format="Commit: %H%nAuthor Date: %cI%nSubject: %s"
          if ! grep -q "ensureFirebaseInitialized" app/src/main/java/com/example/ui/AbkAppNavigation.kt || \
             ! grep -q "ensureFirebaseInitialized" app/src/main/java/com/example/data/firebase/AuthHelper.kt; then
            echo "::error::Checked-out source files are missing the latest Firebase startup fix (ensureFirebaseInitialized). Push the latest code from AI Studio to GitHub before running this workflow."
            exit 1
          fi
          echo "Verified latest ABK source files with Firebase startup fix are present."

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from GitHub Secret."
          elif [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated debug.keystore automatically via keytool."
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:" || true

      - name: Prepare and validate google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json is not present in this checkout. Building APK without google-services.json; add GOOGLE_SERVICES_JSON secret or push app/google-services.json to enable Firebase/Google Sign-In."
            exit 0
          fi

          python3 - <<'PY'
          import json, sys
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          matched = [
              c for c in clients
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.aistudio.abkedu.kpmzqx"
          ]
          if not matched:
              print("::error::app/google-services.json does not match package_name com.aistudio.abkedu.kpmzqx", file=sys.stderr)
              sys.exit(1)
          web_clients = [
              o for o in matched[0].get("oauth_client", [])
              if o.get("client_type") == 3 and o.get("client_id")
          ]
          if not web_clients:
              print("::warning::app/google-services.json is missing OAuth Web Client (client_type: 3) needed for default_web_client_id")
          else:
              print("Verified google-services.json for com.aistudio.abkedu.kpmzqx with OAuth Web Client.")
          PY

      - name: Grant execute permission and remove stale APK outputs
        run: |
          chmod +x gradlew
          rm -f ABK.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Build fresh ABK Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify fresh app-debug.apk and prepare ABK.apk
        id: apk_info
        env:
          START_EPOCH: ${{ steps.build_meta.outputs.start_epoch }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Expected APK was not generated at $APK_PATH"
            exit 1
          fi

          APK_MTIME=$(stat -c %Y "$APK_PATH")
          APK_DATE_UTC=$(date -u -d "@$APK_MTIME" +"%Y-%m-%dT%H:%M:%SZ")
          if [ "$APK_MTIME" -lt "$START_EPOCH" ]; then
            echo "::error::$APK_PATH timestamp ($APK_DATE_UTC) is older than workflow start time!"
            exit 1
          fi

          cp -f "$APK_PATH" ABK.apk

          SRC_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          DST_SHA256=$(sha256sum ABK.apk | awk '{print $1}')
          if [ "$SRC_SHA256" != "$DST_SHA256" ]; then
            echo "::error::Copied ABK.apk checksum mismatch against $APK_PATH"
            exit 1
          fi

          APK_SIZE_BYTES=$(stat -c %s ABK.apk)
          APK_SIZE_HUMAN=$(ls -lh ABK.apk | awk '{print $5}')

          APKSIGNER_BIN=$(command -v apksigner || find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          APK_CERT_SHA1_HEX=""
          APK_CERT_SHA256_HEX=""
          if [ -n "$APKSIGNER_BIN" ] && [ -x "$APKSIGNER_BIN" ]; then
            APK_CERT_INFO=$("$APKSIGNER_BIN" verify --print-certs ABK.apk 2>/dev/null || true)
            APK_CERT_SHA1_HEX=$(printf '%s\n' "$APK_CERT_INFO" | awk -F'SHA-1 digest:' '/SHA-1 digest:/ {gsub(/[[:space:]]/, "", $2); print tolower($2); exit}')
            APK_CERT_SHA256_HEX=$(printf '%s\n' "$APK_CERT_INFO" | awk -F'SHA-256 digest:' '/SHA-256 digest:/ {gsub(/[[:space:]]/, "", $2); print tolower($2); exit}')
          fi
          if [ -z "$APK_CERT_SHA1_HEX" ] && [ -f debug.keystore ]; then
            KS_INFO=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null || true)
            APK_CERT_SHA1_HEX=$(printf '%s\n' "$KS_INFO" | awk -F'SHA1:' '/SHA1:/ {gsub(/[:[:space:]]/, "", $2); print tolower($2); exit}')
            APK_CERT_SHA256_HEX=$(printf '%s\n' "$KS_INFO" | awk -F'SHA256:' '/SHA256:/ {gsub(/[:[:space:]]/, "", $2); print tolower($2); exit}')
          fi
          APK_CERT_SHA1=$(printf '%s' "$APK_CERT_SHA1_HEX" | sed -E 's/../\U&:/g; s/:$//')
          APK_CERT_SHA256=$(printf '%s' "$APK_CERT_SHA256_HEX" | sed -E 's/../\U&:/g; s/:$//')

          SHA1_MATCH_STATUS="UNKNOWN (google-services.json not present)"
          if [ -f app/google-services.json ] && [ -n "$APK_CERT_SHA1_HEX" ]; then
            SHA1_MATCH_STATUS=$(python3 - <<'PY' "$APK_CERT_SHA1_HEX"
          import json, sys
          apk_sha1 = sys.argv[1].strip().lower()
          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          hashes = []
          for c in data.get("client", []):
              for o in c.get("oauth_client", []):
                  h = o.get("android_info", {}).get("certificate_hash")
                  if h:
                      hashes.append(h.lower())
          if not hashes:
              print("NO ANDROID CERTIFICATE_HASH IN google-services.json")
          elif apk_sha1 in hashes:
              print("MATCHED")
          else:
              print(f"MISMATCH (apk={apk_sha1}, expected={','.join(hashes)})")
          PY
            )
            if [[ "$SHA1_MATCH_STATUS" == MISMATCH* ]] || [[ "$SHA1_MATCH_STATUS" == NO* ]]; then
              echo "::warning::APK signing certificate SHA-1 ($APK_CERT_SHA1) does NOT match app/google-services.json ($SHA1_MATCH_STATUS). Google Sign-In will fail after account selection unless you push debug.keystore.base64 / set DEBUG_KEYSTORE_BASE64 secret OR add SHA-1 ($APK_CERT_SHA1) and SHA-256 ($APK_CERT_SHA256) in Firebase Console."
            fi
          fi

          VALUES_XML="app/build/generated/res/processDebugGoogleServices/values/values.xml"
          if [ ! -f "$VALUES_XML" ] || ! grep -q 'name="default_web_client_id"' "$VALUES_XML"; then
            echo "::warning::R.string.default_web_client_id was not generated because google-services.json was absent."
          else
            echo "Firebase resources (including default_web_client_id) were generated into the APK."
          fi

          echo "sha256=$DST_SHA256" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$APK_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_human=$APK_SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "build_time_utc=$APK_DATE_UTC" >> "$GITHUB_OUTPUT"
          echo "cert_sha1=$APK_CERT_SHA1" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$APK_CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "sha1_match_status=$SHA1_MATCH_STATUS" >> "$GITHUB_OUTPUT"

          echo "=== Local Build Artifact Summary ==="
          echo "Source APK : $APK_PATH"
          echo "Release APK: ABK.apk"
          echo "Size       : $APK_SIZE_BYTES bytes ($APK_SIZE_HUMAN)"
          echo "Build Time : $APK_DATE_UTC"
          echo "File SHA256: $DST_SHA256"
          echo "Cert SHA-1 : ${APK_CERT_SHA1:-unavailable}"
          echo "Cert SHA256: ${APK_CERT_SHA256:-unavailable}"
          echo "SHA-1 Check: $SHA1_MATCH_STATUS"

      - name: Replace ABK.apk in v1.0.0 release and verify uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
          LOCAL_SIZE_BYTES: ${{ steps.apk_info.outputs.size_bytes }}
          LOCAL_SIZE_HUMAN: ${{ steps.apk_info.outputs.size_human }}
          LOCAL_SHA256: ${{ steps.apk_info.outputs.sha256 }}
          BUILD_TIME_UTC: ${{ steps.apk_info.outputs.build_time_utc }}
          START_ISO: ${{ steps.build_meta.outputs.start_iso }}
          CERT_SHA1: ${{ steps.apk_info.outputs.cert_sha1 }}
          CERT_SHA256: ${{ steps.apk_info.outputs.cert_sha256 }}
          SHA1_MATCH_STATUS: ${{ steps.apk_info.outputs.sha1_match_status }}
        run: |
          REPO="${{ github.repository }}"
          TAG="v1.0.0"

          RELEASE_BEFORE=$(gh api "repos/${REPO}/releases/tags/${TAG}")
          OLD_ASSET_ID=$(python3 - <<'PY' "$RELEASE_BEFORE"
          import json, sys
          rel = json.loads(sys.argv[1])
          for a in rel.get("assets", []):
              if a.get("name") == "ABK.apk":
                  print(a.get("id", ""))
                  print(f"Found existing ABK.apk on v1.0.0 -> id={a.get('id')}, size={a.get('size')}, updated_at={a.get('updated_at')}", file=sys.stderr)
                  break
          PY
          )

          if [ -n "$OLD_ASSET_ID" ]; then
            echo "Deleting previous ABK.apk asset (id=$OLD_ASSET_ID) from $TAG before uploading the new build..."
            gh release delete-asset "$TAG" "ABK.apk" --yes --repo "$REPO"
          else
            echo "No prior ABK.apk asset found on $TAG."
          fi

          echo "Uploading newly built ABK.apk ($LOCAL_SIZE_BYTES bytes) to $TAG..."
          gh release upload "$TAG" ABK.apk --clobber --repo "$REPO"

          # Verify uploaded asset via GitHub API (retry briefly for API consistency)
          VERIFIED=0
          for attempt in 1 2 3; do
            RELEASE_AFTER=$(gh api "repos/${REPO}/releases/tags/${TAG}")
            if python3 - <<'PY' "$RELEASE_AFTER" "$LOCAL_SIZE_BYTES" "$LOCAL_SHA256" "$START_ISO" "$OLD_ASSET_ID"
          import datetime, json, sys

          rel = json.loads(sys.argv[1])
          local_size = int(sys.argv[2])
          local_sha = sys.argv[3].lower()
          start_dt = datetime.datetime.fromisoformat(sys.argv[4].replace("Z", "+00:00"))
          old_id = sys.argv[5].strip()

          assets = [a for a in rel.get("assets", []) if a.get("name") == "ABK.apk"]
          if len(assets) != 1:
              print(f"Expected exactly 1 ABK.apk asset on release, found {len(assets)}", file=sys.stderr)
              sys.exit(1)

          asset = assets[0]
          new_id = str(asset.get("id", ""))
          remote_size = int(asset.get("size", -1))
          updated_raw = asset.get("updated_at", "")
          updated_dt = datetime.datetime.fromisoformat(updated_raw.replace("Z", "+00:00"))
          digest = (asset.get("digest") or "").lower()
          download_url = asset.get("browser_download_url", "")

          if old_id and new_id == old_id:
              print(f"Asset ID did not change ({new_id}); old asset may not have been replaced.", file=sys.stderr)
              sys.exit(1)

          if remote_size != local_size:
              print(f"Uploaded asset size mismatch: remote={remote_size} vs local={local_size}", file=sys.stderr)
              sys.exit(1)

          if updated_dt < start_dt - datetime.timedelta(seconds=5):
              print(f"Uploaded asset timestamp {updated_raw} is older than workflow start {sys.argv[4]}", file=sys.stderr)
              sys.exit(1)

          if digest and digest != f"sha256:{local_sha}":
              print(f"Uploaded asset digest mismatch: remote={digest} vs local=sha256:{local_sha}", file=sys.stderr)
              sys.exit(1)

          print("=== Verified GitHub Release Asset ===")
          print(f"Release Tag  : {rel.get('tag_name')} (draft={rel.get('draft')}, prerelease={rel.get('prerelease')})")
          print(f"Asset Name   : {asset.get('name')}")
          print(f"Asset ID     : {new_id} (previous={old_id or 'none'})")
          print(f"Remote Size  : {remote_size} bytes")
          print(f"Updated At   : {updated_raw}")
          print(f"Remote Digest: {digest or 'not provided by API'}")
          print(f"Download URL : {download_url}")
          PY
            then
              VERIFIED=1
              break
            fi
            sleep 3
          done

          if [ "$VERIFIED" -ne 1 ]; then
            echo "::error::Failed to verify that ABK.apk in release $TAG was updated to the newly built APK."
            exit 1
          fi

          LATEST_TAG=$(gh api "repos/${REPO}/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "$TAG" ]; then
            echo "::warning::Repository /releases/latest currently points to '$LATEST_TAG' instead of '$TAG'. Direct download URL for v1.0.0 is https://github.com/${REPO}/releases/download/${TAG}/ABK.apk"
          else
            echo "Verified /releases/latest resolves to $TAG."
          fi

          FIREBASE_STATUS="MISSING — تسجيل الدخول وFirestore لن يعملا في هذا الـ APK حتى إضافة GOOGLE_SERVICES_JSON"
          if [ -f app/google-services.json ] && \
             [ -f app/build/generated/res/processDebugGoogleServices/values/values.xml ] && \
             grep -q 'name="default_web_client_id"' app/build/generated/res/processDebugGoogleServices/values/values.xml; then
            FIREBASE_STATUS="INCLUDED & VERIFIED (app/google-services.json + default_web_client_id)"
          fi

          {
            echo "### ABK APK Build & Release Verification"
            echo "- **Tag**: \`$TAG\`"
            echo "- **Firebase Status**: \`$FIREBASE_STATUS\`"
            echo "- **Signing Cert SHA-1 Check**: \`$SHA1_MATCH_STATUS\`"
            echo "- **Signing Cert SHA-1**: \`${CERT_SHA1:-unavailable}\`"
            echo "- **Signing Cert SHA-256**: \`${CERT_SHA256:-unavailable}\`"
            echo "- **Build Time (UTC)**: \`$BUILD_TIME_UTC\`"
            echo "- **APK Size**: \`$LOCAL_SIZE_BYTES bytes\` (\`$LOCAL_SIZE_HUMAN\`)"
            echo "- **APK File SHA-256**: \`$LOCAL_SHA256\`"
            echo "- **Direct APK URL**: https://github.com/${REPO}/releases/download/${TAG}/ABK.apk"
            echo "- **Latest Release URL**: https://github.com/${REPO}/releases/latest"
          } >> "$GITHUB_STEP_SUMMARY"
